<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070f" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#050915" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38ef7d" />
      <stop offset="75%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#f72585" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#00f2fe" stroke-width="3" stroke-opacity="0.25" />

  <!-- Outer Chakra Glowing Ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#ringGrad)" stroke-width="28" stroke-dasharray="800 200" stroke-linecap="round" filter="url(#glow)" transform="rotate(-45 256 256)" />
  
  <!-- Inner Orbit Accent Rings -->
  <circle cx="256" cy="256" r="132" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" stroke-dasharray="16 12" />
  
  <!-- Center Play / Streaming Emblem -->
  <polygon points="220,176 340,256 220,336" fill="url(#playGrad)" filter="url(#glow)" />
  
  <!-- Decorative Glow Rays -->
  <circle cx="256" cy="256" r="22" fill="#00f2fe" opacity="0.8" filter="url(#glow)" />
</svg>
